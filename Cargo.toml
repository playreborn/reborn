[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Reborn contributors"]
repository = "https://github.com/playreborn/reborn"

[workspace.dependencies]
# Internal crates are added here once a crate actually uses another one.
# Always give path AND version, so the crate can be published and cargo-deny
# does not treat it as a wildcard dependency, e.g.:
# reborn-proto = { path = "crates/proto", version = "0.2.0" }
reborn-cm = { path = "crates/cm", version = "0.2.0" }
reborn-content = { path = "crates/content", version = "0.2.0" }
reborn-core = { path = "crates/core", version = "0.2.0" }
reborn-formats = { path = "crates/formats", version = "0.2.0" }
reborn-ipc = { path = "crates/ipc", version = "0.2.0" }
reborn-platform = { path = "crates/platform", version = "0.2.0" }

# External crates. Add new ones here first and justify them in the PR.
anyhow = "1"
# Content engine (ADR 0013): AES-256 ECB/CBC for depot chunks and file names.
# aes 0.8 matches steam-vent's crypto and our MSRV.
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
lzma-rs = "0.3"
# HTTP for content servers; same major version as steam-vent uses.
reqwest = "0.13"
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.14"
clap = { version = "4", features = ["derive"] }
# Platform config/data directories (XDG on Linux, %APPDATA% on Windows).
directories = "6"
# Stream helpers for multi-part Steam responses.
futures-util = "0.3"
# GUI (ADR 0009). The tokio feature runs tasks on the same runtime as the IPC client.
iced = { version = "0.14", features = ["tokio"] }
# Local sockets (named pipes / Unix sockets) for rebornd's IPC. See ADR 0008.
interprocess = { version = "2.4", features = ["tokio"] }
# OS credential stores (Windows Credential Manager, Secret Service). See ADR 0010.
keyring = "4"
# Password prompt without echo.
rpassword = "7"
# IPC messages (newline-delimited JSON). See ADR 0008.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# File checksums in depot manifests.
sha1 = "0.10"
# Steam CM protocol client and its generated protobufs. See ADR 0007.
steam-vent = "0.5"
steam-vent-proto-common = "0.5"
steam-vent-proto-steam = "0.5"
thiserror = "2"
# Compatibility database files in compat/ (plan section 8.5, ADR 0015). MIT OR Apache-2.0.
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Windows only: the current user's SID for the named pipe's access list (ADR 0014).
# Same version interprocess already uses.
# Win32_System_Registry: reborn-observe reads and writes one registry value (ADR 0039).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Registry", "Win32_System_Threading"] }
# Windows only: UTF-16 strings for the pipe's security descriptor (ADR 0014).
# Same version interprocess already uses.
widestring = "1"

[workspace.lints.rust]
missing_docs = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
