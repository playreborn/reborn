[package]
name = "reborn-shim-observe"
description = "Observation tools for the steamclient replacement (ADR 0038, ADR 0039). Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

# rlib for reborn-observe and the tests, cdylib for the proxy DLL that a
# session loads instead of steamclient64.dll (ADR 0039).
[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "reborn-observe"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
interprocess.workspace = true
reborn-platform.workspace = true
reborn-shim-protocol.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints]
workspace = true
