[package]
name = "reborn-shim"
description = "Reborn's steamclient replacement: answers games' calls with Reborn's own data, only for meanings confirmed in docs/shim/ (ADR 0012, ADR 0046, ADR 0047). Not published yet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license = "MIT OR Apache-2.0"
publish = false

# cdylib: the DLL a game loads in shim mode (ADR 0048); rlib for the tests.
[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
interprocess.workspace = true
reborn-shim-protocol.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints]
workspace = true
