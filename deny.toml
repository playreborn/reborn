# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every ignore needs a reason and an exit plan. Review them when updating
# steam-vent or keyring (see docs/adr/0007 and 0010).
ignore = [
    # Marvin attack: timing side channel when decrypting or signing with an
    # RSA *private* key. steam-vent only encrypts the password with Steam's
    # *public* key, so this code path is not used.
    { id = "RUSTSEC-2023-0071", reason = "only RSA public-key encryption is used; no private-key operations" },
    # Stack overflow on deeply nested protobuf input, fixed in protobuf 3.7.2.
    # steam-vent pins protobuf =3.5.1; needs an upstream bump. Input only
    # comes from Valve's CM servers over TLS.
    { id = "RUSTSEC-2024-0437", reason = "pinned by steam-vent; messages only come from Valve over TLS; upstream bump tracked" },
    # zbus components marked unmaintained (no known vulnerability). Linux-only,
    # pulled in by keyring's Secret Service store. Revisit with keyring updates.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained, not vulnerable; Linux keyring backend; revisit with keyring" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained, not vulnerable; Linux keyring backend; revisit with keyring" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained, not vulnerable; Linux keyring backend; revisit with keyring" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow list is meant for future dependencies too; don't warn about
# entries no current dependency uses.
unused-allowed-license = "allow"
# Permissive licenses that are compatible with both our MIT/Apache crates
# and our GPL-3.0-or-later applications.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    # Mozilla's root certificate data in webpki-roots (TLS for Steam
    # connections). A permissive data license, no copyleft.
    "CDLA-Permissive-2.0",
]
# Our own GPL crates. GPL is allowed ONLY for these, so a GPL dependency can
# never sneak into the MIT/Apache protocol crates.
exceptions = [
    { allow = ["GPL-3.0-or-later"], crate = "reborn-core" },
    { allow = ["GPL-3.0-or-later"], crate = "reborn-platform" },
    { allow = ["GPL-3.0-or-later"], crate = "reborn-ipc" },
    { allow = ["GPL-3.0-or-later"], crate = "reborn-testkit" },
    { allow = ["GPL-3.0-or-later"], crate = "rebornd" },
    { allow = ["GPL-3.0-or-later"], crate = "reborn-cli" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
